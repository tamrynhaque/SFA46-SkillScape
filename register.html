<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - SkillScape</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <h1>SkillScape</h1>
        <h2>Create an Account</h2>
        
        <form id="register-form">
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" required placeholder="John Doe">
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" required placeholder="consultant@ten10.com">
            </div>
            
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" required placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn-primary">Sign Up</button>
        </form>
        
        <p class="auth-link">Already have an account? <a href="login.html">Login here</a></p>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
