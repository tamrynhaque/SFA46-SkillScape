<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Users - SkillScape Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>SkillScape <span class="admin-tag">Admin</span></h1>
        <nav>
            <a href="admin.html" class="nav-link">Dashboard</a>
            <a href="users.html" class="nav-link">All Users</a>
            <a href="index.html" class="nav-link">Consultant View</a>
            <a href="login.html" class="nav-link">Logout</a>
        </nav>
    </header>

    <main>
        <section>
            <div class="section-head">
                <h2>All Registered Users</h2>
                <input id="user-search" class="search-input" type="search" placeholder="Search name, email or role...">
            </div>
            <div class="table-wrap">
                <table class="leaderboard-table">
                    <thead>
                        <tr><th>Name</th><th>Email</th><th>Role Path</th><th>Progress</th><th>Targets</th><th></th></tr>
                    </thead>
                    <tbody id="users-body"><tr><td colspan="6" class="muted">Loading...</td></tr></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/db.js"></script>
    <script src="js/common.js"></script>
    <script src="js/users.js"></script>
</body>
</html>
