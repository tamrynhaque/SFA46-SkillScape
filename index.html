<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillScape - NextGen Career Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>SkillScape</h1>
        <nav>
            <a href="index.html" class="nav-link">Dashboard</a>
            <a href="roles.html" class="nav-link">Roles</a>
            <a href="settings.html" class="nav-link">Settings</a>
            <a href="login.html" class="nav-link">Logout</a>
        </nav>
    </header>

    <main>
        <div class="dashboard-header">
            <div>
                <h2>Welcome back, <span id="user-display-name">...</span></h2>
                <p id="user-display-email"></p>
            </div>
            <a href="settings.html" class="btn-primary">Edit Profile</a>
        </div>

        <section id="current-learning">
            <h2>Current Learning Path</h2>
            <div id="learning-path" class="learning-path-box">
                <p class="muted">Loading your progress...</p>
            </div>
        </section>

        <section id="my-skills">
            <h2>My Skills</h2>
            <div id="skills-summary"></div>
        </section>

        <section id="my-targets">
            <h2>My SMART Targets</h2>
            <div id="targets" class="targets-grid"></div>
        </section>

        <section id="explore">
            <h2>Explore Other Roles &amp; Upskill</h2>
            <div id="other-roles" class="roles-grid"></div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/db.js"></script>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/smart.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
