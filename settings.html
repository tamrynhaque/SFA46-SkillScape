<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - SkillScape</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>SkillScape</h1>
        <nav>
            <a href="index.html" class="nav-link">Dashboard</a>
            <a href="roles.html" class="nav-link">Roles</a>
            <a href="settings.html" class="nav-link">Settings</a>
            <a href="login.html" class="nav-link">Logout</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Account Settings</h2>
            <form id="settings-form" class="settings-form">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" disabled>
                </div>
                <div class="form-group">
                    <label for="role">Role Path</label>
                    <select id="role"><option value="">-- No role selected --</option></select>
                </div>
                <div class="form-group">
                    <label for="notifications">Email Notifications</label>
                    <select id="notifications">
                        <option value="all">All (Targets &amp; Updates)</option>
                        <option value="important">Important Only</option>
                        <option value="none">None</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Save Changes</button>
            </form>
        </section>

        <section class="danger-zone">
            <h2>Danger Zone</h2>
            <p class="muted">Reset clears all of your skill progress and SMART targets. This cannot be undone.</p>
            <button id="reset-btn" class="btn-danger">Reset my progress</button>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/db.js"></script>
    <script src="js/common.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
